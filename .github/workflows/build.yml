name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # Primeiro só o jar (para baixar e testar no jogo mesmo se algum teste falhar), depois o build completo.
      - run: ./gradlew assemble --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: stashlink-jars
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
      - run: ./gradlew build --no-daemon
      # Se algum teste falhar, os relatórios ficam para baixar (sem eles, uma falha que só acontece no CI é um mistério).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorios-de-teste
          path: |
            **/build/reports/tests
            **/build/test-results
            fabric/build/run/**/logs/latest.log
          if-no-files-found: ignore
