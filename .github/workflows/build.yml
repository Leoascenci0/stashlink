name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # Primeiro só o jar (para baixar e testar no jogo mesmo se algum teste falhar), depois o build completo.
      - run: ./gradlew assemble --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: stashlink-jars
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
      - run: ./gradlew build --no-daemon
      # TEMPORÁRIO (Item 16.3): o Chrome bloqueia o download do artefato; grava o jar no branch do PR para testar no
      # jogo. Remover este passo e a pasta jar-teste/ antes do merge.
      - name: jar de teste no branch
        if: github.event_name == 'pull_request'
        run: |
          JAR=$(ls fabric/build/libs/stashlink-fabric-*[0-9].jar | head -1)
          cp "$JAR" /tmp/stashlink-fabric-teste.jar
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B jar-teste "origin/$GITHUB_HEAD_REF"
          mkdir -p jar-teste && cp /tmp/stashlink-fabric-teste.jar jar-teste/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jar-teste
          git commit -m "jar de teste (temporário) [skip ci]" && git push origin HEAD:"$GITHUB_HEAD_REF"
