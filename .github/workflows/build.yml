name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # Primeiro só o jar (para baixar e testar no jogo mesmo se algum teste falhar), depois o build completo.
      - run: ./gradlew assemble --no-daemon
      # TEMPORÁRIO (Item 16.3): descobrir a API de poções do 26.3; remover antes do merge.
      - name: diag poções
        if: always()
        continue-on-error: true
        run: |
          for j in $(find ~/.gradle common/build -name "*.jar" 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/world/level/block/entity/BrewingStandBlockEntity.class"; then
              echo "== $j"
              unzip -l "$j" | awk '{print $4}' | grep -i -e "alchemy/" -e "brew"
              mkdir -p /tmp/x && cd /tmp/x && unzip -o -q "$j" 'net/minecraft/*' 2>/dev/null
              for c in $(find net/minecraft -iname "*brew*.class" -o -iname "Potion*.class" | grep -v -F '$'); do echo "--- $c"; javap -p "$c"; done
              echo "--- Level/ServerLevel/MinecraftServer (brew/potion)"
              for c in net/minecraft/world/level/Level.class net/minecraft/server/level/ServerLevel.class net/minecraft/server/MinecraftServer.class net/minecraft/world/level/LevelReader.class; do javap -p "$c" | grep -i -e brew -e potion; done
              echo "--- BrewingStandBlockEntity code"
              javap -p -c net/minecraft/world/level/block/entity/BrewingStandBlockEntity.class | grep -i -e invoke -e getstatic | grep -i -e brew -e potion -e mix | head -40
              cd - >/dev/null; break
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: stashlink-jars
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
      - run: ./gradlew build --no-daemon
